<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 0.4; transform: scale(1); }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .bg-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .floating-node { animation: floatCard 5s ease-in-out infinite; }
    .dash-line { stroke-dasharray: 8 6; animation: dashMove 3s linear infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #ffffff; font-size: 13px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="950" cy="100" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow)" class="bg-pulse"/>
  <circle cx="1050" cy="260" r="140" fill="#ec4899" opacity="0.2" filter="url(#glow)" class="bg-pulse"/>
  <circle cx="150" cy="300" r="120" fill="#3b82f6" opacity="0.15" filter="url(#glow)" class="bg-pulse"/>

  <!-- Background Dynamic Network Nodes & Connected Lines -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.4">
    <line x1="750" y1="90" x2="880" y2="150" class="dash-line" stroke="#6366f1"/>
    <line x1="880" y1="150" x2="1020" y2="100" class="dash-line" stroke="#a855f7"/>
    <line x1="880" y1="150" x2="940" y2="250" class="dash-line" stroke="#ec4899"/>
    <line x1="1020" y1="100" x2="1100" y2="200"/>
  </g>

  <!-- Dynamic Floating Cards / Diagram Elements (Shifted to Background Right) -->
  <g class="floating-node" opacity="0.85">
    <!-- Parent Entity Card -->
    <rect x="820" y="65" width="130" height="50" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="845" cy="90" r="8" fill="#6366f1"/>
    <rect x="860" y="82" width="70" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="860" y="93" width="45" height="5" rx="2.5" fill="#64748b"/>

    <!-- Subsidiary Card 1 -->
    <rect x="960" y="140" width="140" height="55" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="985" cy="167" r="8" fill="#a855f7"/>
    <rect x="1000" y="159" width="75" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="1000" y="170" width="50" height="5" rx="2.5" fill="#64748b"/>

    <!-- Subsidiary Card 2 -->
    <rect x="890" y="235" width="135" height="50" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="915" cy="260" r="8" fill="#ec4899"/>
    <rect x="930" y="252" width="70" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="930" y="263" width="40" height="5" rx="2.5" fill="#64748b"/>
  </g>

  <!-- Foreground Main Banner Header & Text Content -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 50)">
      <rect width="250" height="32" rx="16" fill="url(#pillGrad)" opacity="0.9"/>
      <text x="125" y="21" class="badge-text" text-anchor="middle">🏛️ LEGAL &amp; CORPORATE GRC</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title-text" font-size="42">Awesome Entity Management</text>
    <text x="0" y="185" class="title-text" font-size="42" fill="url(#accentGlow)">Platform Ecosystem</text>

    <!-- Subtitle / Description -->
    <text x="0" y="232" class="subtitle-text" font-size="17">
      <tspan x="0" dy="0">Curated directory of Legal Entity Management (LEM), Corporate Governance,</tspan>
      <tspan x="0" dy="26">Subsidiary Compliance Trackers &amp; Open-Source Architecture Frameworks.</tspan>
    </text>

    <!-- Tech Pill Tags -->
    <g transform="translate(0, 290)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="120" height="26" rx="6" fill="#334155" opacity="0.8"/>
      <text x="60" y="17" class="badge-text" font-size="11" text-anchor="middle" fill="#94a3b8">💼 SaaS Platforms</text>

      <!-- Tag 2 -->
      <rect x="130" y="0" width="135" height="26" rx="6" fill="#334155" opacity="0.8"/>
      <text x="197" y="17" class="badge-text" font-size="11" text-anchor="middle" fill="#94a3b8">⚡ Open Source Tools</text>

      <!-- Tag 3 -->
      <rect x="275" y="0" width="145" height="26" rx="6" fill="#334155" opacity="0.8"/>
      <text x="347" y="17" class="badge-text" font-size="11" text-anchor="middle" fill="#94a3b8">📊 Corporate Analytics</text>
    </g>
  </g>
</svg>
