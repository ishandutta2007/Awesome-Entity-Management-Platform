<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes dashMove{0%{stroke-dashoffset:40}}.bg-pulse{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.floating-node{animation:floatCard 5s ease-in-out infinite}.dash-line{stroke-dasharray:8 6;animation:dashMove 3s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;fill:#fff}.subtitle-text{font-weight:500;fill:#94a3b8}.badge-text{font-weight:600;fill:#fff;font-size:13px}</style><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><circle cx="950" cy="100" r="180" fill="#6366f1" class="bg-pulse" filter="url(#glow)" opacity=".25"/><circle cx="1050" cy="260" r="140" fill="#ec4899" class="bg-pulse" filter="url(#glow)" opacity=".2"/><circle cx="150" cy="300" r="120" fill="#3b82f6" class="bg-pulse" filter="url(#glow)" opacity=".15"/><g stroke="#475569" stroke-width="1.5" opacity=".4"><line x1="750" x2="880" y1="90" y2="150" stroke="#6366f1" class="dash-line"/><line x1="880" x2="1020" y1="150" y2="100" stroke="#a855f7" class="dash-line"/><line x1="880" x2="940" y1="150" y2="250" stroke="#ec4899" class="dash-line"/><line x1="1020" x2="1100" y1="100" y2="200"/></g><g class="floating-node" opacity=".85"><rect width="130" height="50" x="820" y="65" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" rx="10"/><circle cx="845" cy="90" r="8" fill="#6366f1"/><rect width="70" height="6" x="860" y="82" fill="#cbd5e1" rx="3"/><rect width="45" height="5" x="860" y="93" fill="#64748b" rx="2.5"/><rect width="140" height="55" x="960" y="140" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" rx="10"/><circle cx="985" cy="167" r="8" fill="#a855f7"/><rect width="75" height="6" x="1000" y="159" fill="#cbd5e1" rx="3"/><rect width="50" height="5" x="1000" y="170" fill="#64748b" rx="2.5"/><rect width="135" height="50" x="890" y="235" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5" rx="10"/><circle cx="915" cy="260" r="8" fill="#ec4899"/><rect width="70" height="6" x="930" y="252" fill="#cbd5e1" rx="3"/><rect width="40" height="5" x="930" y="263" fill="#64748b" rx="2.5"/></g><g><g transform="translate(60, 0) translate(0, 50)"><rect width="250" height="32" fill="url(#pillGrad)" opacity=".9" rx="16"/><text x="125" y="21" class="badge-text" text-anchor="middle">🏛️ LEGAL &amp; CORPORATE GRC</text></g><text x="0" y="140" class="title-text" font-size="42" transform="translate(60, 0)">Awesome Entity Management</text><text x="0" y="185" fill="url(#accentGlow)" class="title-text" font-size="42" transform="translate(60, 0)">Platform Ecosystem</text><text x="0" y="232" class="subtitle-text" font-size="17" transform="translate(60, 0)"><tspan x="0" dy="0">Curated directory of Legal Entity Management (LEM), Corporate Governance,</tspan> <tspan x="0" dy="26">Subsidiary Compliance Trackers &amp; Open-Source Architecture Frameworks.</tspan></text><g transform="translate(60, 0) translate(0, 290)"><rect width="120" height="26" x="0" y="0" fill="#334155" opacity=".8" rx="6"/><text x="60" y="17" fill="#94a3b8" class="badge-text" font-size="11" text-anchor="middle">💼 SaaS Platforms</text><rect width="135" height="26" x="130" y="0" fill="#334155" opacity=".8" rx="6"/><text x="197" y="17" fill="#94a3b8" class="badge-text" font-size="11" text-anchor="middle">⚡ Open Source Tools</text><rect width="145" height="26" x="275" y="0" fill="#334155" opacity=".8" rx="6"/><text x="347" y="17" fill="#94a3b8" class="badge-text" font-size="11" text-anchor="middle">📊 Corporate Analytics</text></g></g></svg>